plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def generatedTvAssetsDir = layout.buildDirectory.dir('generated/tvAssets')

tasks.register('syncTvAssets', Copy) {
    from(rootProject.file('../public'))
    include 'tv.css', 'tv-navigation.js'
    into(generatedTvAssetsDir)
}

android {
    namespace 'com.sineai.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.sineai.tv"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "1.6"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets.srcDir(generatedTvAssetsDir)
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn('syncTvAssets')
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}
