<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SineAI - Ne İzlesem?</title>
    <meta name="description" content="Ne izlemek istediğini yaz, SineAI sana uygun film ve dizi önerileri getirsin.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HERO -->
    <header class="app-header">
        <div class="hero-glow"></div>
        <div class="container">
            <div class="logo-area">
                <div class="logo-icon">🎬</div>
                <h1 class="logo-text">SineAI</h1>
            </div>
            <p class="tagline">Ne izlemek istediğini yaz, yapay zeka senin için en iyisini bulsun</p>

            <div class="search-wrap">
                <form id="recommendForm">
                    <textarea id="query" name="query" rows="2"
                        placeholder="Örn: Karanlık atmosferli, zeka işi, 2020 sonrası bir dizi öner..."
                        required></textarea>
                    <div class="search-actions">
                        <button type="button" id="voiceBtn" class="btn-voice" tabindex="0">🎤 Ses</button>
                        <button type="submit" id="submitBtn" class="btn-submit" tabindex="0">Öneri getir ✨</button>
                    </div>
                </form>
            </div>

            <div class="mood-pills" id="moodPills">
                <button class="pill" data-query="Gerilim ve korku filmleri öner">😨 Gerilim & Korku</button>
                <button class="pill" data-query="Zeka gerektiren gizem dizileri öner">🤔 Zeka & Gizem</button>
                <button class="pill" data-query="Komedi filmleri öner">😂 Komedi</button>
                <button class="pill" data-query="Romantik filmler öner">❤️ Romantik</button>
                <button class="pill" data-query="Bilim kurgu filmleri öner">🚀 Bilim Kurgu</button>
                <button class="pill" data-query="Oscar ödüllü filmler öner">🏆 Ödüllü Yapımlar</button>
            </div>

            <div id="errorBox" class="error-box hidden"></div>

            <button type="button" id="checkUpdateBtn" class="update-check-btn" tabindex="0">🔄 Güncellemeleri Kontrol Et</button>
        </div>
    </header>

    <!-- DISCOVER (başlangıç ekranı) -->
    <div id="discoverSection">

        <!-- Popüler Filmler -->
        <section class="row-section container">
            <div class="section-head">
                <div class="section-title"><span class="section-dot"></span>Popüler Filmler</div>
                <div class="see-all" data-type="movie">Tümünü gör →</div>
            </div>
            <div class="cards-row" id="popularMoviesRow">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </section>

        <!-- Popüler Diziler -->
        <section class="row-section container">
            <div class="section-head">
                <div class="section-title"><span class="section-dot"></span>Popüler Diziler</div>
                <div class="see-all" data-type="tv">Tümünü gör →</div>
            </div>
            <div class="cards-row" id="popularTvRow">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </section>

        <!-- Film Kategorileri -->
        <section class="row-section container">
            <div class="section-head">
                <div class="section-title"><span class="section-dot"></span>Film Türleri</div>
            </div>
            <div class="genre-grid" id="movieGenreGrid"></div>
        </section>

        <!-- Dizi Kategorileri -->
        <section class="row-section container">
            <div class="section-head">
                <div class="section-title"><span class="section-dot"></span>Dizi Türleri</div>
            </div>
            <div class="genre-grid" id="tvGenreGrid"></div>
        </section>

    </div>

    <!-- RESULTS (arama sonrası) -->
    <main class="container results-container hidden" id="resultsSection">
        <div class="results-back">
            <button id="backToDiscoverBtn" class="back-btn">← Keşfete Dön</button>
        </div>
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p id="loadingText">Yükleniyor...</p>
        </div>
        <div id="resultsGrid" class="results-grid"></div>
        <div id="scrollSentinel" class="scroll-sentinel hidden"></div>
    </main>

    <footer class="app-footer">
        <div class="container">
            <span class="tmdb-badge">TMDB</span>
            <p>Bu ürün TMDB API kullanır.</p>
        </div>
    </footer>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal hidden" role="dialog" aria-modal="true" tabindex="-1">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-btn" aria-label="Kapat" tabindex="0">✕ Kapat</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Update Modal -->
    <div id="updateModal" class="update-modal hidden" role="dialog" aria-modal="true">
        <div class="update-modal-content">
            <h2 id="updateModalTitle"></h2>
            <p id="updateModalMsg"></p>
            <div id="updateModalCommits" class="update-commits hidden"></div>
            <div class="update-modal-actions">
                <button type="button" id="doUpdateBtn" class="update-confirm-btn hidden" tabindex="0">⬆️ Güncelle</button>
                <button type="button" id="closeUpdateModalBtn" class="update-cancel-btn" tabindex="0">Kapat</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
