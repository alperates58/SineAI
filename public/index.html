<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SineAI - Ne İzlesem?</title>
    <meta name="description" content="Ne izlemek istediğini yaz, SineAI sana uygun film ve dizi önerileri getirsin.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="container">
            <div class="header-top">
                <div>
                    <h1>SineAI 🎬</h1>
                    <p>Ne izlemek istediğini yaz, SineAI sana uygun film ve dizi önerileri getirsin.</p>
                </div>
                <button type="button" id="checkUpdateBtn" class="update-check-btn" tabindex="0">🔄 Güncellemeleri Kontrol Et</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <form id="recommendForm">
                <div class="input-group">
                    <textarea id="query" name="query" rows="3" placeholder="Örn: Karanlık atmosferli, zeka işi, 2020 sonrası bir dizi öner..." required></textarea>
                </div>
                <div class="action-buttons">
                    <button type="button" id="voiceBtn" class="voice-btn" tabindex="0">🎤 Sesle Ara</button>
                    <button type="submit" id="submitBtn" tabindex="0">Öneri getir ✨</button>
                </div>
            </form>
            <div id="errorBox" class="error-box hidden"></div>
        </section>

        <section class="results-section">
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>AI analiz ediyor ve TMDB'de aranıyor...</p>
            </div>
            
            <div id="resultsGrid" class="results-grid">
                <!-- Sonuçlar buraya dinamik eklenecek -->
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <div class="container">
            <div class="footer-content">
                <span class="footer-brand">SineAI 🎬</span>
                <span class="footer-dot">·</span>
                <span>AI destekli film &amp; dizi keşfi</span>
                <span class="footer-dot">·</span>
                <span class="footer-tmdb">
                    Veriler:
                    <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="TMDB" class="tmdb-logo">
                </span>
            </div>
        </div>
    </footer>

    <!-- TV Modal -->
    <div id="detailModal" class="modal hidden" role="dialog" aria-modal="true" tabindex="-1">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-btn" aria-label="Kapat" tabindex="0">✕ Kapat</button>
            <div class="modal-body" id="modalBody">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>

    <!-- Update Modal -->
    <div id="updateModal" class="update-modal hidden" role="dialog" aria-modal="true">
        <div class="update-modal-content">
            <h2 id="updateModalTitle"></h2>
            <p id="updateModalMsg"></p>
            <div id="updateModalCommits" class="update-commits hidden"></div>
            <div class="update-modal-actions">
                <button type="button" id="doUpdateBtn" class="update-confirm-btn hidden" tabindex="0">⬆️ Güncelle</button>
                <button type="button" id="closeUpdateModalBtn" class="update-cancel-btn" tabindex="0">Kapat</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
